<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameRadar | Contato</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contato.css">
</head>

<body>

    <header>

        <nav>
            <a href="contato.html" class="pagina-atual">CONTATO</a>

            <a href="index.html">HOME</a>

            <a href="avaliacoes.html">AVALIAÇÕES DE JOGOS</a>

            <a href="noticias.html">NOTÍCIAS</a>

            <a href="lives.html">LIVES</a>
        </nav>

    </header>

    <main>

        <section class="contato">

            <h1>ENTRE EM CONTATO CONOSCO</h1>

            <div class="container-contato">

                <!-- INFORMAÇÕES DE CONTATO -->
                <aside class="info-contato">

                    <div class="info-item">
                        <h2>NOSSO EMAIL:</h2>
                        <p>email@email.com</p>
                    </div>

                    <div class="info-item">
                        <h2>INSTAGRAM:</h2>
                        <p>@gameradar</p>
                    </div>

                    <div class="info-item info-mensagem">
                        <h2>ENVIE SUA MENSAGEM AO LADO!</h2>
                    </div>

                </aside>

                <form class="formulario" id="formulario-contato">

                    <label for="nome">NOME</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>

                    <label for="mensagem">MENSAGEM</label>
                    <textarea id="mensagem" name="mensagem" rows="6" required></textarea>

                    <button type="submit">ENVIAR</button>

                    <p class="aviso-sucesso" id="aviso-sucesso" role="status" hidden>
                        Mensagem enviada com sucesso! Obrigado pelo contato.
                    </p>

                </form>

            </div>

        </section>

    </main>

    <footer>

        <p>GameRadar © 2026 - O universo gamer em seu radar.</p>

    </footer>

    <script src="contato.js"></script>

</body>

</html>
